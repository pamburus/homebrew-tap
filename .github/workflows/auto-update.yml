name: Auto Update Formulas

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      formulas:
        description: Formulas to update (space-separated)
        required: false
        type: string

concurrency:
  group: auto-update-${{ github.ref }}
  cancel-in-progress: false

# Pull requests run unreviewed action updates, so writes go through the app token.
permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

# Pull requests rehearse a release: everything runs except pushing and publishing.
env:
  DRY_RUN: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-updates:
    name: Detect updates
    runs-on: ubuntu-26.04
    outputs:
      updates: ${{ steps.check.outputs.updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - name: Check for updates
        id: check
        run: |
          updates="[]"
          formulas="${{ github.event.inputs.formulas }}"
          for formula in ${formulas:-Formula/*.rb}; do
            package=$(basename "$formula" .rb)
            for version in $(brew livecheck --quiet --newer-only --json "$package" | jq -r '.[].version.latest // empty'); do
              updates=$(echo "$updates" | jq --arg pkg "$package" --arg ver "$version" '. += [{"package": $pkg, "version": $ver}]')
            done
          done
          # New versions are rare, so a dry run rebuilds the current hl version.
          if [[ "$DRY_RUN" == "true" ]]; then
            updates=$(jq '[{"package": "hl", "version": .version}]' src/formula/hl.json)
          fi
          updates_json=$(echo "$updates" | jq -c .)
          echo "updates=$updates_json" >> "${GITHUB_OUTPUT}"

  update-formula:
    name: Update formula
    needs: detect-updates
    if: needs.detect-updates.outputs.updates != '[]'
    strategy:
      matrix:
        update: ${{ fromJson(needs.detect-updates.outputs.updates) }}
        # macOS 27 is only available through the Xcode image label.
        os: [ubuntu-24.04, macos-15, macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3

      - name: Clean Homebrew core data
        run: |
          brew update
          brew doctor || true

      - name: Build bottle
        env:
          PACKAGE: ${{ github.repository }}/${{ matrix.update.package }}
          FORMULA_NAME: ${{ matrix.update.package }}
          VERSION: ${{ matrix.update.version }}
        run: |
          # Render the target formula version from the template without mutating
          # the source spec in the per-runner checkout.
          bin/tapctl.py sync --write-only --version "$VERSION" "$FORMULA_NAME"
          brew test-bot --only-cleanup-before

          # Workaround: Clean untracked files from homebrew-core (e.g., removed formulas like openssl@1.1)
          # Only on macOS where homebrew-core tap exists (Linux uses JSON API)
          if [[ -d "$(brew --repository homebrew/core)" ]]; then
            git -C "$(brew --repository homebrew/core)" clean -fd
          fi

          brew test-bot --only-setup

          brew test-bot --only-formulae --skip-online-checks "$PACKAGE"

      - name: Upload bottles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles-${{ matrix.update.package }}-${{ matrix.update.version }}-${{ matrix.os }}
          path: "*.bottle.*"
          retention-days: 1

  integrate-bottles:
    name: Integrate bottles
    needs: [detect-updates, update-formula]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
      - uses: Homebrew/actions/git-user-config@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3

      - name: Download all bottles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bottles/

      # Pull requests run unreviewed action updates, so they only get the key of a
      # read-only app. Forks receive no secrets and skip this check.
      - name: Generate dry-run token
        id: generate-dry-run-token
        if: env.DRY_RUN == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DRY_RUN_APP_ID }}
          private-key: ${{ secrets.DRY_RUN_APP_PRIVATE_KEY }}

      - name: Check dry-run token
        if: steps.generate-dry-run-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.generate-dry-run-token.outputs.token }}
        run: gh api "repos/$GITHUB_REPOSITORY" --jq .full_name

      - name: Generate token
        id: generate-token
        if: env.DRY_RUN != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Integrate all updates sequentially
        env:
          UPDATES: ${{ needs.detect-updates.outputs.updates }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token || github.token }}
        run: |
          # Work in Homebrew's tap directory where formulas are actually modified
          TAP_DIR="$(brew --repository)/Library/Taps/${{ github.repository }}"
          cd "$TAP_DIR"

          # Configure git in the tap directory
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"

          if [[ "$DRY_RUN" != "true" ]]; then
            git config url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

            # Fetch and checkout the correct branch
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
          fi

          for update in $(echo "$UPDATES" | jq -r '.[] | @base64'); do
            package=$(echo "$update" | base64 -d | jq -r '.package')
            version=$(echo "$update" | base64 -d | jq -r '.version')
            src="src/formula/$package.json"

            echo "Processing $package $version"

            # Move bottles for this package to tap directory
            find "$GITHUB_WORKSPACE/bottles/" -name "bottles-$package-$version-*" -type d | while read -r dir; do
              cp "$dir"/*.bottle.* .
            done

            # Rename bottles based on JSON metadata (the official way)
            for json in ./*.bottle.json; do
              if [[ -f "$json" ]]; then
                local_filename=$(jq -r '.["pamburus/tap/'"$package"'"].bottle.tags[].local_filename // empty' "$json" | head -1)
                filename=$(jq -r '.["pamburus/tap/'"$package"'"].bottle.tags[].filename // empty' "$json" | head -1)
                if [[ -n "$local_filename" && -n "$filename" && -f "$local_filename" ]]; then
                  mv "$local_filename" "$filename"
                fi
              fi
            done

            # Update the formula and persist the spec version once before commit.
            bin/tapctl.py -v sync --write-only --version "$version" --update-spec "$package"

            brew bottle --merge --write --no-commit -- ./*.bottle.json

            # Commit changes
            git add "Formula/$package.rb" "$src"

            if [[ "$DRY_RUN" == "true" ]]; then
              # A successful merge always changes the bottle block.
              if git diff --cached --quiet; then
                echo "::error::No formula changes for $package"
                exit 1
              fi
              git diff --cached --stat
              rm -f ./*.bottle.*
              continue
            fi

            git commit -m "$package: update to $version"
            git push origin ${{ github.ref_name }}

            # Get the commit SHA that was just pushed
            commit_sha=$(git rev-parse HEAD)

            # Create release at the specific commit (exclude JSON files)
            gh release create "$package-$version" --target "$commit_sha" --title "$package-$version" --notes "${package} ${version} with bottles" -- ./*.bottle.tar.gz

            # Clean up bottle files for next iteration
            rm -f ./*.bottle.*
          done

  # A skipped job counts as passed for a required check, so this reports the
  # real outcome of the rehearsal.
  dry-run-result:
    name: Release dry run
    needs: [detect-updates, update-formula, integrate-bottles]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [[ "$result" == "success" ]]
          done
